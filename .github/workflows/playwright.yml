name: Playwright Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # Cho phép bấm chạy tay từ tab Actions trên GitHub
  workflow_dispatch:

jobs:
  test:
    name: Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        # PAUSE=0 tắt chế độ quan sát (bỏ các bước dừng 3-4s, gõ input tốc độ thường)
        run: PAUSE=0 npx playwright test --project=chromium

      - name: Upload HTML report
        # always() => có report cả khi pass lẫn khi fail
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload trace & screenshots (chỉ khi fail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
